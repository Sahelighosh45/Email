version: "3.9"

services:
  redis:
    image: redis:7
    container_name: reachinbox-redis
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: reachinbox-backend
    command: npm run start:server
    ports:
      - "4000:4000"
    env_file:
      - .env
    depends_on:
      - redis

  worker:
    build: .
    container_name: reachinbox-worker
    command: npm run start:worker
    env_file:
      - .env
    depends_on:
      - redis
